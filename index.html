<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информиран избор</title>
    <meta http-equiv="refresh" content="1.5; url=https://informiran-izbor.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f4f7f6;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid #eef3f5;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        h1 {
            color: #1e2b37;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        p {
            color: #5d6d7e;
            font-size: 1rem;
            line-height: 1.6;
            margin: 8px 0;
        }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #eef3f5;
            border-top: 4px solid #e67e22;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .countdown {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e67e22;
            margin: 6px 0;
        }
        .link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: #e67e22;
            color: #fff;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
        }
        .link:hover {
            background: #d35400;
        }
        .link:active {
            transform: scale(0.97);
        }
        .fallback {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .fallback a {
            color: #e67e22;
            text-decoration: none;
            font-weight: 600;
        }
        .fallback a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📢</div>
    <h1>Информиран избор</h1>
    <p>Ще бъдете пренасочени.</p>
    
    <div class="spinner"></div>
    <div class="countdown" id="countdown">2</div>
    
    <a href="https://informiran-izbor.com" class="link">Натиснете тук</a>
    
    <p class="fallback">
        Ако не сте пренасочени автоматично, <a href="https://informiran-izbor.com">натиснете тук</a>.
    </p>
</div>

<script>
    (function() {
        const targetUrl = 'https://informiran-izbor.com';
        let seconds = 2;
        const countdownEl = document.getElementById('countdown');

        const interval = setInterval(() => {
            seconds--;
            if (countdownEl) {
                countdownEl.textContent = seconds;
            }
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = targetUrl;
            }
        }, 1000);

        setTimeout(function() {
            if (window.location.hostname === 'a.informiran-izbor.com') {
                window.location.replace(targetUrl);
            }
        }, 3500);
    })();
</script>

</body>
</html>
